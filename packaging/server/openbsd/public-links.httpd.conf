# Merge these locations into the existing HTTPS server for the FileES origin.
# The example terminates TLS locally; an installation behind relayd may instead
# listen on a loopback port. httpd is chrooted under /var/www, so the FastCGI
# socket below is /var/www/run/filees/filees-links.sock on the host.
server "files.example.net" {
	listen on * tls port 443
	tls {
		certificate "/etc/ssl/files.example.net.fullchain.pem"
		key "/etc/ssl/private/files.example.net.key"
	}

	root "/htdocs/files.example.net"
	directory index "index.html"

	# Static ownership is an explicit allowlist and must precede FileES.
	location "/.well-known/acme-challenge/*" {
		pass
	}
	location "/" {
		pass
	}
	location "/index.html" {
		pass
	}
	location "/favicon.ico" {
		pass
	}
	location "/robots.txt" {
		pass
	}
	location "/assets/*" {
		pass
	}

	# All remaining paths are virtual FileES paths. Do not use "not found":
	# a physical directory must never shadow /<realm>/<slug>.
	location "/*" {
		fastcgi socket "/run/filees/filees-links.sock"
	}
}
