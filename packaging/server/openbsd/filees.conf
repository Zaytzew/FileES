# FileES has no listener of its own. These accounts are closed protocol
# entries through the system sshd. The first key is a public capability only.
Match User _filees-onboard
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	AuthorizedKeysFile /etc/ssh/filees_bootstrap_authorized_keys
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	ForceCommand /usr/local/libexec/filees/filees-bootstrap-entry
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	MaxSessions 1

Match User _filees-data
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	AuthorizedKeysFile none
	AuthorizedKeysCommand /bin/cat /var/filees/activation/authorized_keys
	AuthorizedKeysCommandUser _filees-state
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	MaxAuthTries 1
	MaxSessions 1

Match User _filees-tunnel
	AuthenticationMethods keyboard-interactive:bsdauth
	PubkeyAuthentication no
	AuthorizedKeysFile none
	PasswordAuthentication no
	KbdInteractiveAuthentication yes
	ForceCommand /usr/local/libexec/filees/filees-entry
	AllowTcpForwarding remote
	AllowStreamLocalForwarding no
	PermitListen 127.0.0.1:42000
	PermitOpen none
	GatewayPorts no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	# BSD Auth challenge + response consumes two sshd authentication turns.
	MaxAuthTries 2
	MaxSessions 1

Match User _filees-client
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	# sshd runs the fixed reader as the state owner. The login account never
	# receives filesystem access to the atomically rendered key set.
	AuthorizedKeysFile none
	AuthorizedKeysCommand /bin/cat /var/filees/activation/authorized_keys
	AuthorizedKeysCommandUser _filees-state
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	MaxAuthTries 1
	MaxSessions 1

Match User _filees-recovery
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	AuthorizedKeysFile none
	AuthorizedKeysCommand /usr/local/libexec/filees/filees-recovery-authorize authorize %t %k
	AuthorizedKeysCommandUser _filees-state
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	MaxAuthTries 1
	MaxSessions 1
