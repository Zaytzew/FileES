# Copy the server block into /etc/httpd.conf after replacing the hostname and
# certificate paths. httpd is chrooted under /var/www, so this FastCGI socket
# is /var/www/run/filees/filees-links.sock on the host.
server "get.example.net" {
	listen on * tls port 443
	tls {
		certificate "/etc/ssl/get.example.net.fullchain.pem"
		key "/etc/ssl/private/get.example.net.key"
	}
	fastcgi socket "/run/filees/filees-links.sock"
}
