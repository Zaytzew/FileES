# FileES has no listener of its own. These accounts are closed protocol
# entries through the system sshd. The first key is a public capability only.
Match User _filees-onboard
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	AuthorizedKeysFile /etc/ssh/filees_bootstrap_authorized_keys
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	ForceCommand /usr/local/libexec/filees/filees-bootstrap-entry
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	MaxSessions 1

Match User _filees-data
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	AuthorizedKeysFile none
	AuthorizedKeysCommand /bin/cat /var/filees/activation/authorized_keys
	AuthorizedKeysCommandUser _filees-state
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	# A single key still costs sshd two authentication turns: OpenSSH clients
	# probe with an unsigned SSH_MSG_USERAUTH_PK_OK query before the real,
	# signed attempt. MaxAuthTries 1 rejected every legitimate connection
	# with "Too many authentication failures" even though the client only
	# ever offered its one, correct key - confirmed live with `ssh -v`
	# against this exact account. Same reasoning _filees-tunnel already
	# documents for its two-turn BSD Auth challenge/response.
	MaxAuthTries 2
	MaxSessions 1

Match User _filees-tunnel
	AuthenticationMethods keyboard-interactive:bsdauth
	PubkeyAuthentication no
	AuthorizedKeysFile none
	PasswordAuthentication no
	KbdInteractiveAuthentication yes
	ForceCommand /usr/local/libexec/filees/filees-entry
	AllowTcpForwarding remote
	AllowStreamLocalForwarding no
	PermitListen 127.0.0.1:42000
	PermitOpen none
	GatewayPorts no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	# BSD Auth challenge + response consumes two sshd authentication turns.
	MaxAuthTries 2
	MaxSessions 1

Match User _filees-client
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	# sshd runs the fixed reader as the state owner. The login account never
	# receives filesystem access to the atomically rendered key set.
	AuthorizedKeysFile none
	AuthorizedKeysCommand /bin/cat /var/filees/activation/authorized_keys
	AuthorizedKeysCommandUser _filees-state
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	# A single key still costs sshd two authentication turns: OpenSSH clients
	# probe with an unsigned SSH_MSG_USERAUTH_PK_OK query before the real,
	# signed attempt. MaxAuthTries 1 rejected every legitimate connection
	# with "Too many authentication failures" even though the client only
	# ever offered its one, correct key - confirmed live with `ssh -v`
	# against this exact account. Same reasoning _filees-tunnel already
	# documents for its two-turn BSD Auth challenge/response.
	MaxAuthTries 2
	MaxSessions 1

Match User _filees-mobile
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	# The Android client's forced command is baked per-key into the same
	# shared authorized_keys file desktop reads (pkg/activation.renderAccessLocked
	# picks MobileEntryPath vs ClientEntryPath by Record.Kind) - no ForceCommand
	# here, so that per-key restrict,command= is what actually executes.
	AuthorizedKeysFile none
	AuthorizedKeysCommand /bin/cat /var/filees/activation/authorized_keys
	AuthorizedKeysCommandUser _filees-state
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	# A single key still costs sshd two authentication turns: OpenSSH clients
	# probe with an unsigned SSH_MSG_USERAUTH_PK_OK query before the real,
	# signed attempt. MaxAuthTries 1 rejected every legitimate connection
	# with "Too many authentication failures" even though the client only
	# ever offered its one, correct key - confirmed live with `ssh -v`
	# against this exact account. Same reasoning _filees-tunnel already
	# documents for its two-turn BSD Auth challenge/response.
	MaxAuthTries 2
	MaxSessions 1

Match User _filees-recovery
	AuthenticationMethods publickey
	PubkeyAuthentication yes
	AuthorizedKeysFile none
	AuthorizedKeysCommand /usr/local/libexec/filees/filees-recovery-authorize authorize %t %k
	AuthorizedKeysCommandUser _filees-state
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	AllowStreamLocalForwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	# A single key still costs sshd two authentication turns: OpenSSH clients
	# probe with an unsigned SSH_MSG_USERAUTH_PK_OK query before the real,
	# signed attempt. MaxAuthTries 1 rejected every legitimate connection
	# with "Too many authentication failures" even though the client only
	# ever offered its one, correct key - confirmed live with `ssh -v`
	# against this exact account. Same reasoning _filees-tunnel already
	# documents for its two-turn BSD Auth challenge/response.
	MaxAuthTries 2
	MaxSessions 1
